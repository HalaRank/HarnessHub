name: Windows Desktop candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      [
        "apps/desktop/**",
        "packages/shared/**",
        "scripts/desktop*",
        "scripts/version.ts",
        "scripts/verify-windows-installer.ps1",
        "package.json",
        "bun.lock",
        ".github/workflows/desktop-windows.yml",
      ]
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install only Desktop dependencies
        run: bun install --filter '@harnesshub/desktop' --filter '!harnesshub' --frozen-lockfile --ignore-scripts
      - run: node apps/desktop/node_modules/electron/install.js
      - run: bun run version:check
      - name: Release boundary tests
        working-directory: apps/desktop
        run: bun test tests/release.test.ts
      - run: bun run desktop:release
      - name: Isolated install, upgrade, uninstall (no WSL on this runner)
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-installer.ps1 -ReleaseDirectory "dist/desktop/releases/$version-unsigned"
      - uses: actions/upload-artifact@v4
        with:
          name: HarnessHub-windows-x64-unsigned
          path: |
            dist/desktop/releases/*-unsigned/*.exe
            dist/desktop/releases/*-unsigned/*.zip
            dist/desktop/releases/*-unsigned/SHA256SUMS.txt
            dist/desktop/releases/*-unsigned/release-manifest.json
          retention-days: 14
