name: Windows Desktop candidate
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  workflow_dispatch:
  pull_request:
    paths:
      [
        "apps/desktop/**",
        "packages/shared/**",
        "scripts/desktop*",
        "scripts/version.ts",
        "scripts/verify-windows-installer.ps1",
        "package.json",
        "bun.lock",
        ".github/workflows/desktop-windows.yml",
      ]
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install only Desktop dependencies
        run: bun install --filter '@harnesshub/desktop' --filter '!harnesshub' --frozen-lockfile --ignore-scripts
      - run: node apps/desktop/node_modules/electron/install.js
      - name: Check versions without the Linux TUI preload
        working-directory: apps/desktop
        run: bun ../../scripts/version.ts --check
      - name: Read version and validate release tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package version v$version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Release boundary tests
        working-directory: apps/desktop
        run: bun test tests/release.test.ts
      - name: Build Windows release without the Linux TUI preload
        working-directory: apps/desktop
        run: bun ../../scripts/desktop.ts package
      - name: Isolated install, upgrade, uninstall (no WSL on this runner)
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-installer.ps1 -ReleaseDirectory "dist/desktop/releases/$version-unsigned"
      - uses: actions/upload-artifact@v4
        with:
          name: HarnessHub-windows-x64-unsigned
          path: |
            dist/desktop/releases/${{ steps.version.outputs.version }}-unsigned/*.exe
            dist/desktop/releases/${{ steps.version.outputs.version }}-unsigned/*.zip
            dist/desktop/releases/${{ steps.version.outputs.version }}-unsigned/SHA256SUMS.txt
            dist/desktop/releases/${{ steps.version.outputs.version }}-unsigned/release-manifest.json
          if-no-files-found: error
          retention-days: 14
